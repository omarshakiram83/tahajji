:root{
  --bg1:#18294a; --bg2:#0a1322;
  --card:#fff7e4; --ink:#16223f;
  --orange:#f36c00; --green:#15924d;
  --gap:2.2vw;
  --bk-green:#1f9a3c; --bk-red:#d8232a; --bk-blue:#2f6fd0; --bk-navy:#263a86; --bk-ink:#1b1b1b; --hit:#15924d; --sel-border:#d8232a;   /* selected: whole letter green, square border red */
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden}
body{
  background:radial-gradient(120% 120% at 50% 35%,var(--bg1),var(--bg2));
  font-family:"Tahajji","Scheherazade New","Amiri","Noto Naskh Arabic",serif;
  color:#fff; cursor:pointer; user-select:none; -webkit-user-select:none;
}
#top{
  position:fixed; top:0; left:0; right:0; height:9vh;
  display:flex; align-items:center; justify-content:space-between;
  padding:0 4vw; font-size:max(2.6vh,15px); letter-spacing:.02em;
}
#ttl,#cnt,#hint{opacity:.6}
#cnt{direction:rtl}
#side{display:flex; align-items:center; gap:2vw}
#back{
  font:inherit; font-size:max(2.4vh,14px); color:#fff; cursor:pointer;
  background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.28);
  border-radius:999px; padding:.3em 1.2em;
}
#back:hover{background:rgba(255,255,255,.24)}
body[data-view="index"]{cursor:default}
body[data-view="index"] #stage, body[data-view="index"] #bar, body[data-view="index"] #side{display:none}
body[data-view="stage"] #index, body[data-view="stage"] #hint{display:none}
#index{
  position:fixed; inset:9vh 3vw 3vh 3vw; overflow-y:auto; direction:rtl;
  display:grid; gap:1vh 1.6vw;
  grid-template-columns:repeat(var(--cols),1fr);
  grid-template-rows:repeat(var(--rows),minmax(max(5vh,44px),1fr));
}
.g{
  display:flex; align-items:stretch; direction:rtl; overflow:hidden;
  background:var(--card); color:var(--ink); border-radius:1.1vw; cursor:pointer;
  border:.5vh solid transparent;
  box-shadow:0 .6vh 1.8vh rgba(0,0,0,.28);
  transition:transform .15s ease, border-color .15s ease, background-color .2s ease;
}
.g:hover{border-color:var(--orange); transform:translateY(-.3vh)}
.g > span{
  flex:1; display:flex; align-items:center; justify-content:center;
  font-size:var(--ifs); line-height:1.2; font-weight:700; padding-bottom:.06em;
}
.g > span + span{border-inline-start:1px solid rgba(22,34,63,.14)}
.g.done{background:#d8f3e2; color:#0b5a30; border-color:var(--green)}
.g.done > span + span{border-inline-start-color:rgba(11,90,48,.2)}
.gap{visibility:hidden}
#stage{
  position:fixed; inset:9vh 3vw 6vh 3vw;
  display:flex; align-items:stretch; justify-content:center; gap:var(--gap);
  direction:rtl;
}
.box{
  flex:1 1 0; min-width:0; max-width:var(--boxmax,none);
  display:flex; align-items:center; justify-content:center;
  background:var(--card); color:var(--ink);
  border-radius:2.4vw;
  font-size:var(--fs); line-height:1.5; font-weight:700;
  box-shadow:0 1.2vw 3.5vw rgba(0,0,0,.35), inset 0 -.6vw 0 rgba(0,0,0,.06);
  transition:background-color .3s ease,color .3s ease,transform .3s ease,box-shadow .3s ease;
  padding-bottom:.08em;
}
.box.orange{
  background:var(--orange); color:#fff; transform:scale(1.03);
  box-shadow:0 0 0 .5vw rgba(243,108,0,.28), 0 1.5vw 5vw rgba(243,108,0,.45);
}
.box.green{
  background:var(--green); color:#fff;
  box-shadow:0 1.2vw 3.5vw rgba(21,146,77,.35), inset 0 -.6vw 0 rgba(0,0,0,.08);
}
.box.enter{animation:zoomIn .45s cubic-bezier(.2,.9,.3,1.15) backwards}
@keyframes zoomIn{
  from{opacity:0; transform:scale(.55)}
  to{opacity:1; transform:scale(1)}
}
#bar{position:fixed; left:0; bottom:0; height:.7vh; width:0; background:linear-gradient(90deg,var(--orange),var(--green)); transition:width .3s}
/* ---- book colouring: letter green, vowel marks dark, small waw/ya red ---- */
.lt{position:relative; display:inline-block; white-space:nowrap; direction:rtl}
.L1{position:absolute; top:0; right:0; white-space:nowrap}
.c-ink{color:var(--bk-ink)} .c-red{color:var(--bk-red)} .c-clr{color:transparent}
.c-grn{color:var(--bk-green); -webkit-text-stroke:.014em var(--bk-green)}
.lt.wd{font-kerning:none}
.fB{font-family:"TahajjiB"} .fM{font-family:"TahajjiM"}   /* letters-only / marks-only copies of the font */
.lt.hlw .c-col{-webkit-text-stroke:0}
.g{position:relative}
body.inplace .sec{grid-column:1/-1; color:var(--bk-red); text-align:right; padding:.2em .4em 0; font-size:clamp(13px, 2.3vh, 26px); line-height:1.3}
body.inplace .g.has-nm{flex-direction:column}
body.inplace .g.has-nm > i.nm{align-self:flex-start; margin:.15em .45em 0; font-style:normal; color:var(--bk-ink); line-height:1;
  font-size:clamp(10px, 1.9vh, 22px); pointer-events:none}
body.inplace .g.sel > i.nm{color:var(--hit)}
.g > i.tag{position:absolute; right:.45em; top:50%; transform:translateY(-50%); font-style:normal;
  color:var(--bk-red); font-size:clamp(11px, 2.2vh, 26px); line-height:1; pointer-events:none}
/* the label is a small heading ABOVE the first square, at its far right (user request, like the book) */
body.inplace .g.has-tag > i.tag{top:auto; bottom:100%; right:.2em; transform:none; margin-bottom:.55em; font-size:clamp(13px, 2.4vh, 28px)}
.grad{background:linear-gradient(to bottom, var(--bk-green) 0%, var(--bk-green) 52%, var(--bk-red) 68%, var(--bk-red) 100%);
  -webkit-background-clip:text; background-clip:text; color:transparent; -webkit-text-fill-color:transparent}
body.inplace .g.sel .grad{background:none; color:var(--hit); -webkit-text-fill-color:var(--hit)}   /* same letter spacing with and without marks, so the coloured layer lines up */
.c-redm{color:var(--bk-red); -webkit-text-stroke:.014em var(--bk-red)}   /* red marks (shadda + its vowel) */
.c-col{color:var(--wc); -webkit-text-stroke:.014em var(--wc)}   /* word letters in the book colour (navy / blue / green) */
.c-ink,.c-red,.c-grn,.c-col{transition:color .25s ease, -webkit-text-stroke-color .25s ease}
body.ink .box.green{background:#dcf4e4; box-shadow:0 0 0 .55vw var(--sel-border), 0 0 0 1.3vw rgba(216,35,42,.25), 0 1.5vw 4.5vw rgba(216,35,42,.4)}
body.ink .box.green .c-ink, body.ink .box.green .c-red{color:var(--hit)}
body.ink .box.green .c-grn{color:var(--hit); -webkit-text-stroke-color:var(--hit)}
body.ink .box.enter{animation:none}
/* ---- in-place mode: the card itself is selected, nothing opens ---- */
body.inplace #back, body.inplace #hint{display:none}
body.inplace{background:#ffffff; color:#16223f}                       /* white page (user request) */
/* frame around the whole page (user request): green outer line, thin red inner line */
body.inplace::before{content:""; position:fixed; inset:max(.9vh,5px); pointer-events:none; z-index:5;
  border:max(.6vh,3px) solid var(--bk-green); border-radius:max(1.8vh,10px);
  box-shadow:inset 0 0 0 max(.45vh,2px) #fff, inset 0 0 0 max(.7vh,3.5px) var(--bk-red)}
body.inplace{--fr:max(3vh,16px)}
body.inplace #top{top:var(--fr); left:var(--fr); right:var(--fr); padding:.4vh 2.2vw}
body.inplace #cnt{color:#16223f; opacity:.75; white-space:nowrap; flex-shrink:0}
body.inplace .g{border-color:#e6dcc4; box-shadow:0 .4vh 1.4vh rgba(22,34,63,.12)}
body.inplace #ttl{color:#d8232a; opacity:1; font-size:clamp(16px, min(5.6vh, 5.4vw), 72px)}
/* "الدرس ..." in green at the far right of the header (user request); the rest of the title stays centred */
#lesson{display:none}
body.inplace #lesson{display:block; position:absolute; right:2.2vw; top:50%; transform:translateY(-50%);
  color:var(--bk-green); font-size:clamp(16px, min(5.6vh, 5.4vw), 72px); line-height:1.25; white-space:nowrap}
body.inplace #top{height:auto; min-height:7vh; padding:.8vh 4vw; gap:3vw; align-items:center}
body.inplace #ttl{flex:1; line-height:1.25; text-align:center; padding-inline:max(5.5vw,3.2em)}
body.inplace #side{position:absolute; left:2.2vw; top:50%; transform:translateY(-50%)}
#ttl .sub{font-size:.78em; display:block; white-space:nowrap}
#ttl .main{white-space:nowrap}
@media (max-aspect-ratio:1/1){ body.inplace #side{top:.6vh; transform:none}
  body.inplace #lesson{top:.6vh; transform:none} }
body.inplace #index{gap:.7vh 1.2vw; inset:var(--top-h,7vh) calc(var(--fr) + 1vw) calc(var(--fr) + .4vh) calc(var(--fr) + 1vw); overflow:hidden;
  grid-template-rows:repeat(var(--rows),minmax(0,1fr))}
body.inplace .g{min-height:0}
body.inplace .g > span{min-height:0}
body.inplace .g{overflow:visible}

/* كلمة كاملة {w, c}: الحروف بلون الكتاب والحركات داكنة (طبقتان كما في حروف الدرس الثاني عشر) */
const MARK = /[ً-ٰٟۖ-ۜ۟-۪ۤۧۨ-ۭ࣓-ࣿ]/;   // حركات وعلامات فوق/تحت الحرف
const SPACING = /[ۥۦ]/;                                                        // الواو والياء الصغيرتان (لها عرض)
function fill(el, t){
  if (typeof t === 'string') { el.textContent = t; return; }
  const sp = (c, x) => { const e = document.createElement('span'); e.className = c; e.textContent = x; return e; };
  if (t.gr !== undefined) {           // {gr: text}: letters in the book's green-to-red print (green above, red below), marks dark
    const lt = sp('lt wd hlw', ''), lb = sp('L0 fB', ''), lm = sp('L1 fM', '');
    lb.append(sp('grad', t.gr)); lm.append(sp('c-ink', t.gr)); lm.setAttribute('aria-hidden', 'true');
    lt.append(lb, lm); el.append(lt); return;
  }
  if (t.segs !== undefined) {
    // {segs: [[text, body, marks], ...]}: colour per letter, k = dark, g = green, r = red; a part that starts with a mark
    // only recolours the marks of the letter before it. Same two-layer method as hl (letters font + marks font, same text).
    const C = { k: 'var(--bk-ink)', g: 'var(--bk-green)', r: 'var(--bk-red)', b: 'var(--bk-blue)', n: 'var(--bk-navy)' };
    const clusters = [];
    for (const [txt, b, m] of t.segs) {
      let first = true;
      for (const ch of txt) {
        if (MARK.test(ch) && clusters.length) { const last = clusters[clusters.length - 1]; last[0] += ch; if (first) last[2] = m || b; }
        else clusters.push([ch, b, m || b]);
        first = false;
      }
    }
    const lt = sp('lt wd hlw', ''), lb = sp('L0 fB', ''), lm = sp('L1 fM', '');
    const add = (layer, txt, col) => { const e = sp('c-col', txt); e.style.setProperty('--wc', C[col]); layer.append(e); };
    const run = (layer, i) => { let txt = '', col = null;
      for (const c of clusters) { if (c[i] !== col && txt) { add(layer, txt, col); txt = ''; } col = c[i]; txt += c[0]; }
      if (txt) add(layer, txt, col); };
    run(lb, 1); run(lm, 2);
    lm.setAttribute('aria-hidden', 'true');
    lt.append(lb, lm); el.append(lt); return;
  }
  if (t.hl !== undefined) {
    // {hl: "..."}: [x] = letter green, its marks (shadda / vowel / sukun / madda) red;  {x} = letter and its marks green;  rest dark.
    // Drawn twice with the SAME text: a letters-only font copy and a marks-only font copy (identical metrics and shaping),
    // so the two layers line up exactly in every browser and a letter's marks can have their own colour.
    const clusters = []; let type = 0;
    for (const ch of t.hl) {
      if (ch === '[') type = 'r'; else if (ch === '{') type = 'g'; else if (ch === ']' || ch === '}') type = 0;
      else if (MARK.test(ch) && clusters.length) clusters[clusters.length - 1][0] += ch;
      else clusters.push([ch, type]);
    }
    const lt = sp('lt wd hlw', ''), lb = sp('L0 fB', ''), lm = sp('L1 fM', '');
    const add = (layer, txt, col) => { const e = sp('c-col', txt); e.style.setProperty('--wc', col); layer.append(e); };
    const run = (layer, colOf) => { let txt = '', col = null;
      for (const [c, ty] of clusters) { const k = colOf(ty); if (k !== col && txt) { add(layer, txt, col); txt = ''; } col = k; txt += c; }

    run(lb, ty => ty ? 'var(--bk-green)' : 'var(--bk-ink)');

    l0.append(sp('c-ink', t.w)); lt.append(l0);

}

const player = new Audio(); player.preload = 'auto';
function hush(){ player.pause(); }
function play(a){
  if (!a) return Promise.resolve(false);
  player.pause(); playing = a;
  if (player.getAttribute('data-src') !== a.src) { player.src = a.src; player.setAttribute('data-src', a.src); }

}

const GAP = 1500;

const playBtn = document.getElementById('play');
function untilEnd(a, run){
  return new Promise(res => {
    if (!a) return res();
    let fin = false;
    const done = () => { if (fin) return; fin = true; player.removeEventListener('ended', done); player.removeEventListener('error', done); clearInterval(t); res(); };
    const t = setInterval(() => { if (auto !== run) done(); }, 100);
    player.addEventListener('ended', done); player.addEventListener('error', done);
    play(a).then(ok => { if (!ok) setTimeout(done, 2500); });   // إن منع المتصفح الصوت: يكمل التحديد بلا توقف
  });
}
const wait = (ms, run) => new Promise(res => { const t0 = Date.now();
  const t = setInterval(() => { if (auto !== run || Date.now() - t0 >= ms) { clearInterval(t); res(); } }, 50); });
function stopAuto(){
  if (!auto) return;
  auto = 0; playBtn.classList.remove('on'); playBtn.textContent = '▶ تشغيل الدرس كاملًا';

}
async function playLesson(){
  if (auto) { stopAuto(); return; }
  const run = auto = Date.now();
  playBtn.classList.add('on'); playBtn.textContent = '■ إيقاف';
  if (cur >= 0) { cards[cur].classList.remove('sel'); cur = -1; updSel(); }
  if (titleSound) { titleSaid = true; await untilEnd(titleSound, run); if (auto !== run) return; await wait(GAP, run); }

    if (auto !== run) return;
    if (cur >= 0) cards[cur].classList.remove('sel');
    cur = g; cards[g].classList.add('sel'); updSel();
    await untilEnd(sounds[g], run);
    if (auto !== run) return;

}

}
function toggleSel(g){
  stopAuto();
  if (cur >= 0) cards[cur].classList.remove('sel');
  cur = g; cards[g].classList.add('sel');
  updSel(); say(g);
}
function updSel(){
  cnt.textContent = cur < 0 ? '' : AR(order.indexOf(cur) + 1) + ' / ' + AR(groups.length);
}
function selNext(){
  stopAuto();
  if (cur < 0 && titleSound && !titleSaid && soundOn) { sayTitle(); return; }   // أول مسافة: العنوان، ثم الحروف
  const i = order.indexOf(cur); if (i < order.length - 1) toggleSel(order[i + 1]); }
function selBack(){ const i = order.indexOf(cur); if (i > 0) toggleSel(order[i - 1]); }
function setView(v){ view = v; document.body.dataset.view = v; if (document.activeElement) document.activeElement.blur(); }
function showIndex(){
  cards.forEach((c, g) => c.classList.toggle('done', done.has(g)));
  setView('index');
}
function openGroup(g){ step = g * PER; shown = -1; setView('stage'); render(); }
document.getElementById('back').addEventListener('click', e => { e.stopPropagation(); showIndex(); });

function render(){
  const g = Math.floor(step / PER), s = step % PER;
  if (g !== shown) {
    stage.innerHTML = '';
    groups[g].forEach(t => {
      const d = document.createElement('div');
      d.className = 'box enter';
      fill(d, t);
      stage.appendChild(d);
    });
    shown = g;
  }
  [...stage.children].forEach((b, i) => {
    b.classList.remove('orange', 'green');
    if (s === 0) return;
    if (s === PER - 1) b.classList.add('green');
    else if (i < s - 1) b.classList.add('green');
    else if (i === s - 1) b.classList.add('orange');
  });
  if (s === PER - 1) done.add(g);
  cnt.textContent = AR(g + 1) + ' / ' + AR(groups.length);
  bar.style.width = (step / (TOTAL - 1) * 100) + '%';
}
function next(){ if (step < TOTAL - 1) { step++; render(); } }
function prev(){ if (step > 0) { step--; render(); } }

document.addEventListener('click', () => { if (view === 'stage') next(); });
document.addEventListener('keyup', e => { if (e.key === ' ') e.preventDefault(); });
document.addEventListener('keydown', e => {
  if (e.repeat) return;
  if (e.key === 'f' || e.key === 'F') {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
    return;
  }
  if (CFG.inPlace) {
    if (e.key === 'h' || e.key === 'H' || e.key === 'ا') { document.body.classList.toggle('hide-ctl'); dispatchEvent(new Event('resize')); return; }
    if ((e.key === 'p' || e.key === 'P' || e.key === 'ح') && (sounds.some(Boolean) || titleSound)) { playLesson(); return; }
    if (e.key === 'ArrowLeft' || e.key === ' ') { e.preventDefault(); selNext(); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); selBack(); }
    return;
  }
  if (view !== 'stage') return;
  if (e.key === 'ArrowLeft' || e.key === ' ')  { e.preventDefault(); next(); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); prev(); }
  else if (e.key === 'Escape') { showIndex(); }
});
showIndex();
if (CFG.inPlace) { document.body.classList.add('inplace'); updSel(); fitCards(); }
/* حجم الحروف: أكبر حجم واحد يناسب كل المربعات، وكل حرف في منتصف مربعه */
function fitCards(){
  const go = () => {
    /* الشبكة تبدأ تحت العنوان مهما كان طوله (سطر أو سطرين على الجوال) */
    /* مكان "الدرس ..." يمينًا: في الشاشة العريضة العنوان في الوسط بعيدًا عنه، وفي الجوال الطولي العنوان تحته */
    const ttl = document.getElementById('ttl'), ls = document.getElementById('lesson'), sd = document.getElementById('side');
    const gapPx = 16;
    const ctl = document.getElementById('ctl'), top = document.getElementById('top');
    if (innerWidth > innerHeight) { if (ctl.parentNode !== sd) sd.append(ctl); }
    else { if (ctl.parentNode !== top) top.append(ctl);
      ctl.style.top = (Math.max(ls.offsetTop + ls.offsetHeight, sd.offsetTop + sd.offsetHeight) + 4) + 'px'; }
    if (innerWidth > innerHeight) {
      const pad = Math.max(ls.offsetWidth, sd.offsetWidth) + gapPx;
      ttl.style.paddingInline = pad + 'px'; ttl.style.paddingTop = '0px';
    } else { ttl.style.paddingInline = '0px'; ttl.style.paddingTop = (Math.max(ls.offsetHeight, sd.offsetHeight) + (ctl.offsetHeight ? ctl.offsetHeight + 10 : 0)) + 'px'; }
    const tagEl = document.querySelector('.g > i.tag');   // room inside the grid box, above the first row, for the label heading
    if (tagEl) index.style.paddingTop = (tagEl.offsetHeight * 1.6 + 6) + 'px';
    document.body.style.setProperty('--top-h', (Math.max(document.getElementById('top').getBoundingClientRect().bottom, sd.getBoundingClientRect().bottom) + 4) + 'px');
    const cv = document.createElement('canvas').getContext('2d');
    cv.font = '700 100px Tahajji'; cv.direction = 'rtl';
    const m0 = cv.measureText('ب');
    const A = m0.fontBoundingBoxAscent / 100, D = m0.fontBoundingBoxDescent / 100;
    const ink = cards.map((c, g) => { const t = groups[g][0]; const m = cv.measureText(typeof t === 'string' ? t : (t.gr !== undefined ? t.gr : t.segs !== undefined ? t.segs.map(x => x[0]).join('') : t.hl !== undefined ? t.hl.replace(/[\[\]{}]/g, '') : t.w !== undefined ? t.w : t.b + t.m + t.r));
      return { h: (m.actualBoundingBoxAscent + m.actualBoundingBoxDescent) / 100,
               c: (m.actualBoundingBoxAscent - m.actualBoundingBoxDescent) / 200,
               w: (m.actualBoundingBoxLeft + m.actualBoundingBoxRight) / 100 }; });
    const c0 = cards.find(Boolean), r = c0.getBoundingClientRect();
    const H = c0.clientHeight * 0.9, W = c0.clientWidth * 0.85;
    const hs = ink.map(i => i.h).sort((a, b) => b - a);
    const FH = H / hs[1];
    const fw = cards.map((c, g) => c.clientWidth * 0.85 / ink[g].w).filter(Boolean).sort((a, b) => a - b);
    const F = CFG.fitEach ? Math.min(FH, fw[Math.floor(fw.length / 2)]) : Math.min(FH, fw[0]);   // one shared size (fitEach: only a too-long word is made smaller in its own card)   // الحجم الموحد (أطول حرف فقط يصغر قليلا ليبقى داخل المربع)
    cards.forEach((c, g) => { const hh = c.classList.contains('has-nm') ? c.querySelector(':scope > span').clientHeight * 0.85 : H;
      const fs = Math.min(F, hh / ink[g].h, H / ink[g].h, c.clientWidth * 0.85 / ink[g].w);
      c.style.setProperty('--fit', fs + 'px');
      c.style.setProperty('--dy', ((ink[g].c - (A - D) / 2) * fs) + 'px'); });
  };
  Promise.all(['Tahajji', 'TahajjiB', 'TahajjiM'].map(f => document.fonts.load('700 100px ' + f).catch(() => {}))).then(go);
  window.addEventListener('resize', go);
  if (window.ResizeObserver) new ResizeObserver(go).observe(document.getElementById('top'));
}
