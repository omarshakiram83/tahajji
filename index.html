:root{--green:#1f9a3c; --red:#d8232a; --ink:#16223f; --card:#fff7e4; --fr:max(3vh,16px)}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html{background:#fff}
body{margin:0; min-height:100vh; background:#fff; color:var(--ink);
  font-family:"Tahajji","Scheherazade New","Amiri","Noto Naskh Arabic",serif; font-weight:700}
body::before{content:""; position:fixed; inset:max(.9vh,5px); pointer-events:none; z-index:5;
  border:max(.6vh,3px) solid var(--green); border-radius:max(1.8vh,10px);
  box-shadow:inset 0 0 0 max(.45vh,2px) #fff, inset 0 0 0 max(.7vh,3.5px) var(--red)}
html,body{height:100%; overflow:hidden}
/* the list scrolls INSIDE the frame */
main{position:fixed; inset:calc(var(--fr) + 2px); overflow-y:auto; padding:2vh 2.5vw 3vh}
main > *{max-width:1500px; margin-inline:auto}
header{text-align:center; margin-bottom:3vh}
h1{margin:0; color:var(--green); font-size:clamp(30px, 6vw, 72px); line-height:1.3}
header p{margin:.2em 0 0; color:var(--red); font-size:clamp(18px, 2.8vw, 34px)}
#list{display:grid; gap:clamp(10px,1.6vw,22px); grid-template-columns:repeat(auto-fill, minmax(min(100%, 230px), 1fr))}
@media (max-width:600px){ #list{grid-template-columns:1fr 1fr} .card{padding:.6em .5em} }
#list{}
.card{display:flex; flex-direction:column; justify-content:center; gap:.3em; min-height:clamp(90px, 15vh, 170px);
  padding:.8em 1em; background:var(--card); border:2px solid #e6dcc4; border-radius:16px;
  box-shadow:0 4px 14px rgba(22,34,63,.1); color:inherit; text-decoration:none; text-align:center;
  transition:border-color .2s, box-shadow .2s, transform .2s}
a.card:hover, .card.multi:hover{border-color:var(--red); box-shadow:0 6px 20px rgba(216,35,42,.25); transform:translateY(-2px)}
.card .n{color:var(--green); font-size:clamp(19px, 2.4vw, 32px); line-height:1.3}
.card .t{color:var(--red); font-size:clamp(18px, 1.9vw, 26px); line-height:1.4}
.card .pages{display:flex; flex-wrap:wrap; gap:.4em; justify-content:center; margin-top:.2em}
.card .pages a{color:#fff; background:var(--green); border-radius:999px; padding:.15em .9em; text-decoration:none;
  font-size:clamp(15px, 1.5vw, 20px)}
.card .pages a:hover{background:var(--red)}
.card.soon{opacity:.45; box-shadow:none; background:#faf6ec}
.card.soon .t{color:#8a8070}
#err{display:none; text-align:center; color:var(--red); font-size:20px}
</style>
</head>
<body>
<main>
  <header><h1>دورة التهجي</h1><p>قواعد تهجي الأداء اللفظ القرآني</p></header>
  <div id="list"></div>
  <p id="err">ملف الدروس lessons.js غير موجود بجانب هذه الصفحة.</p>
</main>
<script src="lessons.js"></script>
<script>
const L = window.TAHAJJI_LESSONS, list = document.getElementById('list');
if (!Array.isArray(L)) document.getElementById('err').style.display = 'block';
else L.forEach(l => {
  const pages = l.pages || [];
  const c = document.createElement(pages.length === 1 ? 'a' : 'div');
  c.className = 'card' + (pages.length ? (pages.length > 1 ? ' multi' : '') : ' soon');
  if (pages.length === 1) c.href = pages[0].file;
  const n = document.createElement('span'); n.className = 'n'; n.textContent = l.name; c.append(n);
  const t = document.createElement('span'); t.className = 't'; t.textContent = pages.length ? (l.title || '') : (l.title || 'قريبًا'); c.append(t);
  if (pages.length > 1) { const w = document.createElement('span'); w.className = 'pages';
    pages.forEach(p => { const a = document.createElement('a'); a.href = p.file; a.textContent = p.title; w.append(a); });
    c.append(w); }
  list.append(c);
});
</script>
</body>
</html>
